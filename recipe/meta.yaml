{% set name = "outlines-core" %}
{% set version = "0.2.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/outlines_core-{{ version }}.tar.gz
  sha256: 64808deed1591ca3029ff64346ceb974cd5d780c916ea82504951fe83523039e

build:
  # Upstream pyproject.toml requires-python = ">=3.8"; the 0.2.x series ships
  # cp310-cp314 wheels on PyPI, so support py3.10 through py3.14.
  skip: true  # [py<310]
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - pkg-config
  host:
    - python
    - pip
    # Upstream 0.2.x switched build backend from setuptools-rust to maturin
    # (https://github.com/dottxt-ai/outlines-core/blob/0.2.14/pyproject.toml#L1-L3).
    - maturin >=1.0,<2.0
    # The hf-hub Rust crate (optional, ureq+rustls-tls features) and the
    # tokenizers Rust crate (required, =0.22.2) both link openssl on unix.
    - openssl  # [unix]
  run:
    - python
    # No Python-level runtime deps: 0.2.x dropped interegular and jsonschema
    # (the 0.1.x recipe carried them; upstream's requires_dist for 0.2.14 is
    # test-extras-only — `requires_dist` lists only `extra == "test"` entries).

test:
  source_files:
    - tests/
  imports:
    - outlines_core
  commands:
    - pip check
    - pytest -v tests/
  requires:
    - pip
    # Test extras mirrored from upstream 0.2.14 pyproject.toml [project.optional-dependencies.test]:
    - pytest
    - pytest-benchmark
    - pytest-mock
    - pydantic
    - numpy
    - scipy
    - pytorch
    - transformers
    - datasets
    - sentencepiece
    # numba is required by the imported `outlines_core.kernels.numpy` module's
    # check at test time; without it `import outlines_core.kernels.numpy`
    # raises ImportError (conda-forge hit the same issue).
    - numba

about:
  home: https://github.com/dottxt-ai/outlines-core
  summary: Structured Text Generation in Rust
  description: |
    This package provides the core functionality for structured generation
    with a focus on performance and portability. It offers a convenient way
    to build regular expressions from JSON schemas and construct an Index
    object by combining a Vocabulary and regular expression to efficiently
    map tokens from a given vocabulary to state transitions in a finite-state
    automaton.
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  dev_url: https://github.com/dottxt-ai/outlines-core
  doc_url: https://github.com/dottxt-ai/outlines-core

extra:
  recipe-maintainers:
    - ianaobi
    - bkreider
    - pavelzw
